<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Reyan Luxe - Redirecting...</title>
    <meta name="robots" content="noindex">
    <script>
      // Single Page Apps for GitHub Pages - Fixed Version
      // This script handles the redirect from 404 errors back to index.html
      
      (function() {
        'use strict';
        var loc = window.location;
        var repoName = 'Reyan_Luxe';
        var basePath = '/' + repoName + '/';
        var isMobile = /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent);
        var search = loc.search || '';
        if (search.startsWith('?/')) {
          window.location.replace(basePath);
          return;
        }
        if (search.length > (isMobile ? 60 : 100)) {
          window.location.replace(basePath);
          return;
        }
        var path = loc.pathname;
        var route = path.indexOf(basePath) === 0 ? path.slice(basePath.length) : path;
        route = route.replace(/^\/+/, '');
        var redirectUrl = loc.protocol + '//' + loc.hostname + (loc.port ? ':' + loc.port : '') + basePath;
        if (route && route !== '/') {
          redirectUrl += '?/' + route;
        }
        if (loc.hash) {
          redirectUrl += loc.hash;
        }
        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
    <div style="text-align: center; margin-top: 50px; font-family: Arial, sans-serif;">
      <h2>Reyan Luxe - Redirecting...</h2>
      <p>If you are not redirected automatically, please click <a href="/Reyan_Luxe/">here</a>.</p>
    </div>
  </body>
</html>
